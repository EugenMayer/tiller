name: Release

# Builds the gem when a version tag (e.g. 3.0.1) is pushed and attaches it to a GitHub release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/tiller/version -e 'print VERSION')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version in lib/tiller/version.rb"
            exit 1
          fi
      - name: Build gem
        run: gem build tiller.gemspec
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tiller-$GITHUB_REF_NAME.gem" --title "$GITHUB_REF_NAME" --generate-notes
