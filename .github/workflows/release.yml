name: Release

# Builds the gem when a version tag (e.g. 3.1.0) is pushed and attaches it, with its checksum, to a GitHub release.
# The gem also gets a build provenance attestation, see the README on how to verify it.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/tiller/version -e 'print VERSION')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version in lib/tiller/version.rb"
            exit 1
          fi
      - name: Build gem
        run: gem build tiller.gemspec
      - name: Create checksum
        run: sha256sum "tiller-$GITHUB_REF_NAME.gem" > "tiller-$GITHUB_REF_NAME.gem.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tiller-${{ github.ref_name }}.gem
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tiller-$GITHUB_REF_NAME.gem" "tiller-$GITHUB_REF_NAME.gem.sha256" --title "$GITHUB_REF_NAME" --generate-notes
